[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boletin"
version = "0.1.0"
description = "Clima actual de una ciudad, empaquetado sobre Open-Meteo."
requires-python = ">=3.9"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
boletin = "boletin.cli:main"
boletin-pantalla = "boletin.web:main"

[tool.setuptools.package-data]
boletin = ["estatico/index.html", "estatico/charts.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
